name: Build Mod

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - 'README.md'
      - '.gitignore'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest
            build-config: RelWithDebInfo

          - name: macOS
            os: macos-latest

          - name: iOS
            os: macos-latest
            target: iOS

          - name: Android32
            os: ubuntu-latest
            target: Android32

          - name: Android64
            os: ubuntu-latest
            target: Android64

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: 'latest'
          build-config: ${{ matrix.config.build-config || 'Release' }}
          combine: true
          target: ${{ matrix.config.target }}
          ccache-variant: ${{ matrix.config.os != 'macos-latest' && 'sccache' || '' }}

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: build
    permissions: write-all

    steps:
      - name: Combine builds
        uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: BetterPause-build
          path: ${{ steps.build.outputs.build-output }}

      - name: Create nightly release
        uses: andelf/nightly-release@main
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: nightly
          name: 'Development Release'
          body: |
            Build of BetterPause for commit ${{ github.sha }}.
          files: |
            ${{ steps.build.outputs.build-output }}/*.geode
